<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timed Auction POC</title>
    <script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/2.3.4/stomp.min.js"></script>
    <style>
        body { font: 16px system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #172033; }
        section { border: 1px solid #ccd3df; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
        label { display: inline-block; margin: .4rem; }
        input, button { padding: .5rem; }
        button { cursor: pointer; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f5f8; padding: 1rem; }
        .status { font-weight: 700; }
    </style>
</head>
<body>
<h1>Timed Auction POC</h1>
<p>Each accepted bid increases the current bid by 1,000. No payments are processed.</p>

<section>
    <h2>1. Create bidders</h2>
    <label>Number of users
        <input id="userCount" type="number" min="1" max="1000000" value="10">
    </label>
    <button onclick="createUsers()">Create users</button>
    <p id="userResult"></p>
</section>

<section>
    <h2>2. Start an auction</h2>
    <label>Title <input id="title" value="Demo auction"></label>
    <label>Duration (minutes) <input id="duration" type="number" min="1" max="1440" value="15"></label>
    <label>Starting bid <input id="startingBid" type="number" min="0" value="0"></label>
    <button onclick="createAuction()">Start auction</button>
    <p id="auctionResult"></p>
</section>

<section>
    <h2>3. Place bids</h2>
    <label>Auction ID <input id="auctionId" type="number" min="1" onchange="startAuctionAutoRefresh()"></label>
    <label>User ID <input id="userId" type="number" min="1"></label>
    <button onclick="placeBid()">Bid +1,000</button>
    <button onclick="refreshAuction()">Refresh status</button>
    <div id="auctionStatus" class="status">No auction selected.</div>
    <small>Status updates automatically every 2 seconds for the selected auction.</small>
    <p id="bidResult"></p>
</section>

<section>
    <h2>4. Final report</h2>
    <button onclick="loadReport()">Load report</button>
    <a id="csvLink" href="#" hidden>Download CSV</a>
    <pre id="report"></pre>
</section>

<script>
    let stompClient;
    let auctionRefreshTimer;
    let auctionRefreshInFlight = false;
    let monitoredAuctionId;
    let latestAuction;

    function auctionId() {
        return Number(document.getElementById('auctionId').value);
    }

    async function request(url, options) {
        const response = await fetch(url, options);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.message || `Request failed (${response.status})`);
        return body;
    }

    async function createUsers() {
        try {
            const result = await request('/api/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({count: Number(document.getElementById('userCount').value)})
            });
            document.getElementById('userResult').textContent =
                `Created ${result.created} bidders, IDs ${result.firstUserId}–${result.lastUserId}.`;
            document.getElementById('userId').value = result.firstUserId;
        } catch (error) {
            document.getElementById('userResult').textContent = error.message;
        }
    }

    async function createAuction() {
        try {
            const result = await request('/api/auctions', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    durationMinutes: Number(document.getElementById('duration').value),
                    startingBid: Number(document.getElementById('startingBid').value)
                })
            });
            document.getElementById('auctionId').value = result.id;
            document.getElementById('auctionResult').textContent =
                `Started auction ${result.auctionNumber} (ID ${result.id}).`;
            connectToAuction(result.id);
            showAuction(result);
            startAuctionAutoRefresh();
        } catch (error) {
            document.getElementById('auctionResult').textContent = error.message;
        }
    }

    async function placeBid() {
        try {
            const result = await request(`/api/auctions/${auctionId()}/bids`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userId: Number(document.getElementById('userId').value)})
            });
            document.getElementById('bidResult').textContent =
                `Bid #${result.sequence}: ${result.userName} bid ${result.amount}.`;
            await refreshAuction();
        } catch (error) {
            document.getElementById('bidResult').textContent = error.message;
        }
    }

    async function refreshAuction() {
        const id = auctionId();
        if (!Number.isSafeInteger(id) || id < 1 || auctionRefreshInFlight) return;
        auctionRefreshInFlight = true;
        try {
            const auction = await request(`/api/auctions/${id}`);
            if (auctionId() === id) showAuction(auction);
        } catch (error) {
            if (auctionId() === id) document.getElementById('auctionStatus').textContent = error.message;
        } finally {
            auctionRefreshInFlight = false;
        }
    }

    function startAuctionAutoRefresh() {
        if (auctionRefreshTimer) clearInterval(auctionRefreshTimer);
        const id = auctionId();
        if (!Number.isSafeInteger(id) || id < 1) {
            monitoredAuctionId = undefined;
            latestAuction = undefined;
            return;
        }
        if (monitoredAuctionId !== id) {
            monitoredAuctionId = id;
            latestAuction = undefined;
        }
        refreshAuction();
        auctionRefreshTimer = setInterval(refreshAuction, 2000);
    }

    function showAuction(auction) {
        if (auctionId() !== auction.id) return;
        if (latestAuction && latestAuction.id === auction.id) {
            if (auction.totalBids < latestAuction.totalBids
                    || (auction.totalBids === latestAuction.totalBids
                    && auction.remainingSeconds > latestAuction.remainingSeconds)
                    || (latestAuction.status === 'ENDED' && auction.status !== 'ENDED')) return;
        }
        latestAuction = auction;
        document.getElementById('auctionStatus').textContent =
            `Auction ${auction.auctionNumber} — ${auction.status} — current bid: ${auction.currentBid} — ` +
            `accepted bids: ${auction.totalBids} — seconds remaining: ${auction.remainingSeconds}`;
    }

    function connectToAuction(id) {
        if (stompClient) stompClient.disconnect();
        stompClient = Stomp.over(new SockJS('/ws'));
        stompClient.debug = null;
        stompClient.connect({}, () => {
            stompClient.subscribe(`/topic/auctions/${id}`, message => showAuction(JSON.parse(message.body)));
        });
    }

    async function loadReport() {
        try {
            const id = auctionId();
            const result = await request(`/api/auctions/${id}/report`);
            document.getElementById('report').textContent = JSON.stringify(result, null, 2);
            const link = document.getElementById('csvLink');
            link.href = `/api/auctions/${id}/report.csv`;
            link.hidden = false;
        } catch (error) {
            document.getElementById('report').textContent = error.message;
        }
    }
</script>
</body>
</html>
