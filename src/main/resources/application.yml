spring:
  application:
    name: auction-poc
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auction}
    username: ${SPRING_DATASOURCE_USERNAME:auction}
    password: ${SPRING_DATASOURCE_PASSWORD:auction}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        cache:
          use_second_level_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        javax:
          cache:
            provider: org.ehcache.jsr107.EhcacheCachingProvider
            missing_cache_strategy: create
  flyway:
    enabled: true
  thymeleaf:
    cache: false
server:
  error:
    include-message: always
