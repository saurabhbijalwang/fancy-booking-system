spring:
  application:
    name: auction-poc
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auction}
    username: ${SPRING_DATASOURCE_USERNAME:auction}
    password: ${SPRING_DATASOURCE_PASSWORD:auction}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "hibernate.jdbc.batch_size": 0
      "hibernate.order_inserts": true
      "hibernate.cache.use_second_level_cache": true
      "hibernate.cache.region.factory_class": org.hibernate.cache.jcache.internal.JCacheRegionFactory
      "hibernate.javax.cache.provider": org.ehcache.jsr107.EhcacheCachingProvider
      "hibernate.javax.cache.uri": ehcache.xml
      "hibernate.javax.cache.missing_cache_strategy": fail
      "jakarta.persistence.sharedCache.mode": ENABLE_SELECTIVE
  flyway:
    enabled: true
  thymeleaf:
    cache: false
server:
  error:
    include-message: always
